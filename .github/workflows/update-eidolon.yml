name: Update Eidolon

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-eidolon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Install Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Ensure data directory exists
        run: mkdir -p data

      - name: Update Stats
        run: npm run update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Evolve Creature
        run: npm run evolve

      - name: Generate Badge
        run: npm run badge

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/stats.json data/creature.json public/creature.svg badge.svg
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: update eidolon stats, creature, and badge"
            # -Xtheirs forces our local generated changes to win during the rebase
            git pull --rebase -Xtheirs
            git push
          fi
